<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Papelería DAMAE - Registrar Producto</title>
</head>
<body>
    <h2>Registro de Productos - Papelería DAMAE</h2>
    
    <!-- El formulario usa method="POST" para enviar los datos de forma segura -->
    <form action="ProductoServlet" method="POST">
        <label>Nombre del Producto:</label><br>
        <input type="text" name="nombre" required><br><br>

        <label>Descripción:</label><br>
        <input type="text" name="descripcion" required><br><br>

        <label>Precio:</label><br>
        <input type="number" step="0.01" name="precio" required><br><br>

        <label>Stock:</label><br>
        <input type="number" name="stock" required><br><br>

        <label>ID Categoría:</label><br>
        <input type="number" name="categoriaId" required><br><br>

        <button type="submit">Guardar Producto</button>
    </form>
    
    <br>
    <a href="ProductoServlet">Ver lista de productos (GET)</a>
</body>
</html>
